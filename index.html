<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A task manager with labels, priorities, deadlines and reminders." />
    <!-- Browser bar colour per theme: the main purple of the header band -->
    <meta name="theme-color" content="#2e1f6b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#3a2a85" media="(prefers-color-scheme: dark)" />
    <title>Task Manager</title>
    <!-- Theme before the first paint, so dark mode never flashes light -->
    <script>
      try { var savedTheme = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.dataset.theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      // AI features' quick add bar and plan button show from the first
      // paint, so they never push the list down; the mic only where the
      // browser can listen
      try { if (localStorage.getItem('ai') === 'on') document.documentElement.classList.add('ai-on'); } catch (e) {}
      if (window.SpeechRecognition || window.webkitSpeechRecognition) document.documentElement.classList.add('speech');
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <!-- Fonts are local (fonts/) so both languages work offline -->
    <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Pinned local copy of Lucide so icons work offline -->
    <script src="lib/lucide-1.51.0.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- MOVING BACKGROUND (decorative) -->
    <div class="backdrop live" aria-hidden="true">
      <span class="blob blob-main blob-1"></span>
      <span class="blob blob-accent blob-2"></span>
      <span class="blob blob-main blob-3"></span>
      <span class="blob blob-accent blob-4"></span>
      <span class="blob blob-main blob-5"></span>
    </div>

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <button class="icon-btn shine" id="btn-add" data-i18n-title="header.add" data-i18n-aria-label="header.add">
          <i data-lucide="plus"></i>
        </button>
        <button class="icon-btn" id="btn-delete" disabled>
          <i data-lucide="trash-2"></i>
        </button>
        <button class="icon-btn" id="btn-edit" disabled>
          <i data-lucide="pencil"></i>
        </button>
        <button class="icon-btn" id="btn-reload" data-i18n-title="header.reload" data-i18n-aria-label="header.reload">
          <i data-lucide="rotate-cw"></i>
        </button>
      </div>

      <div class="header-center">
        <h1 class="app-title" data-i18n="app.title"></h1>
      </div>

      <div class="header-right">
        <button class="lang-btn" id="btn-lang" type="button" data-i18n-title="lang.switch" data-i18n-aria-label="lang.switch"></button>
        <button class="icon-btn" id="btn-filter" data-i18n-title="header.filter" data-i18n-aria-label="header.filter">
          <i data-lucide="filter"></i>
        </button>
        <button class="icon-btn" id="btn-search" data-i18n-title="header.search" data-i18n-aria-label="header.search">
          <i data-lucide="search"></i>
        </button>
        <button class="icon-btn" id="btn-menu" data-i18n-title="header.menu" data-i18n-aria-label="header.menu">
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>

    <!-- TOP BAND: today's progress over drifting glows, with waves below -->
    <div class="hero">
      <div class="hero-art live" aria-hidden="true">
        <span class="glow glow-1"></span>
        <span class="glow glow-2"></span>
        <span class="glow glow-3"></span>
      </div>
      <div class="stats">
        <div class="stats-row">
          <span class="stats-icon" aria-hidden="true"><i data-lucide="target"></i></span>
          <span class="stats-text" id="stats-text"></span>
          <span class="stats-percent" id="stats-percent" aria-hidden="true"></span>
        </div>
        <div class="progress" id="progress" role="progressbar" data-i18n-aria-label="stats.label" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
      <div class="waves live" aria-hidden="true">
        <div class="wave wave-back">
          <svg viewBox="0 0 2400 56" preserveAspectRatio="none"><path d="M0 0V34Q300 56 600 34T1200 34T1800 34T2400 34V0Z" /></svg>
        </div>
        <div class="wave wave-mid">
          <svg viewBox="0 0 2400 56" preserveAspectRatio="none"><path d="M0 0V26Q300 8 600 26T1200 26T1800 26T2400 26V0Z" /></svg>
        </div>
        <div class="wave wave-front">
          <svg viewBox="0 0 2400 56" preserveAspectRatio="none"><path d="M0 0V16Q300 32 600 16T1200 16T1800 16T2400 16V0Z" /></svg>
        </div>
      </div>
    </div>

    <!-- MAIN -->
    <main class="main">

      <!-- QUICK ADD (AI features, ai.js): a task in plain words fills the add form -->
      <div class="ai-quick ai-only" id="ai-quick">
        <i data-lucide="wand-sparkles"></i>
        <input type="text" id="ai-quick-input" dir="auto" maxlength="300" autocomplete="off" enterkeyhint="go"
          data-i18n-placeholder="ai.quickPlaceholder" data-i18n-aria-label="ai.quickLabel" />
        <button type="button" class="icon-btn ai-mic" id="btn-ai-mic" aria-pressed="false" data-i18n-title="ai.mic" data-i18n-aria-label="ai.mic">
          <i data-lucide="mic"></i>
        </button>
        <button type="button" class="icon-btn ai-go" id="btn-ai-go" disabled data-i18n-title="ai.quickGo" data-i18n-aria-label="ai.quickGo">
          <i data-lucide="arrow-right"></i>
        </button>
        <span class="sr-only" id="ai-quick-status" role="status"></span>
      </div>

      <!-- SEARCH BAR -->
      <div class="search-bar" id="search-bar">
        <i data-lucide="search"></i>
        <input type="text" id="search-input" dir="auto" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="header.search" />
        <button class="icon-btn" id="btn-clear-search" data-i18n-title="search.clear" data-i18n-aria-label="search.clear" hidden>
          <i data-lucide="circle-x"></i>
        </button>
        <!-- Smart search: also finds tasks by meaning (semantic.js) -->
        <button type="button" class="smart-toggle" id="btn-smart" aria-pressed="false" data-i18n-title="smart.toggle" data-i18n-aria-label="smart.toggle">
          <i data-lucide="sparkles"></i>
          <span class="smart-toggle-text" data-i18n="smart.short"></span>
        </button>
        <button class="icon-btn" id="btn-close-search" data-i18n-title="search.close" data-i18n-aria-label="search.close">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- SMART SEARCH DOWNLOAD: progress of the one-time download -->
      <div class="smart-status" id="smart-status" hidden>
        <span class="smart-status-icon" aria-hidden="true"><i data-lucide="download"></i></span>
        <div class="smart-status-body">
          <p class="smart-status-text" id="smart-status-text"></p>
          <div class="smart-progress" id="smart-progress" role="progressbar" data-i18n-aria-label="smart.progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="smart-progress-bar" id="smart-progress-bar"></div>
          </div>
        </div>
        <button type="button" class="btn-secondary smart-cancel" id="btn-smart-cancel" data-i18n="smart.cancel"></button>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar" id="filter-bar">
        <div class="segmented status-filter" role="group" data-i18n-aria-label="filter.byStatus">
          <button class="seg-btn filter-btn active" data-filter="all" data-i18n="filter.all"></button>
          <button class="seg-btn filter-btn" data-filter="active" data-i18n="filter.active"></button>
          <button class="seg-btn filter-btn" data-filter="overdue" data-i18n="filter.overdue"></button>
          <button class="seg-btn filter-btn" data-filter="completed" data-i18n="filter.completed"></button>
        </div>
        <select class="toolbar-select" id="filter-label" data-i18n-aria-label="filter.byLabel">
          <option value="all" data-i18n="filter.allLabels"></option>
        </select>
        <select class="toolbar-select" id="filter-priority" data-i18n-aria-label="filter.byPriority">
          <option value="all" data-i18n="filter.allPriorities"></option>
          <option value="high" data-i18n="priority.high"></option>
          <option value="medium" data-i18n="priority.medium"></option>
          <option value="low" data-i18n="priority.low"></option>
        </select>
      </div>

      <!-- LIST TOOLBAR -->
      <div class="list-toolbar">
        <!-- Plan my day (AI features, ai.js) -->
        <button type="button" class="ai-plan-btn ai-only" id="btn-ai-plan" aria-haspopup="dialog">
          <i data-lucide="list-ordered"></i>
          <span data-i18n="ai.plan"></span>
        </button>
        <div class="sort-control">
          <span id="sort-label" data-i18n="sort.by"></span>
          <div class="segmented" role="group" aria-labelledby="sort-label">
            <button type="button" class="seg-btn" data-sort="deadline" aria-pressed="true" data-i18n="sort.deadline"></button>
            <button type="button" class="seg-btn" data-sort="priority" aria-pressed="false" data-i18n="sort.priority"></button>
          </div>
        </div>
      </div>

      <!-- TASK LIST -->
      <section class="task-list" id="task-list"></section>

      <!-- EMPTY STATE: a clipboard with a check -->
      <div class="empty-state" id="empty-state">
        <svg class="empty-art" viewBox="0 0 120 120" aria-hidden="true">
          <rect class="art-board" x="24" y="18" width="66" height="86" rx="12" />
          <rect class="art-clip" x="41" y="10" width="32" height="16" rx="6" />
          <path class="art-line" d="M38 48h30M38 62h38M38 76h22" />
          <circle class="art-badge" cx="86" cy="88" r="17" />
          <path class="art-tick" d="M78 88l6 6 10-11" />
        </svg>
        <p></p>
      </div>

    </main>

    <!-- ADD/EDIT MODAL -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">

        <div class="modal-header">
          <h2 class="modal-title" id="modal-title"></h2>
          <button class="icon-btn" id="btn-close-modal" data-i18n-title="modal.close" data-i18n-aria-label="modal.close">
            <i data-lucide="x"></i>
          </button>
        </div>

        <div class="modal-body">

          <div class="form-group">
            <label for="input-name" data-i18n="field.name"></label>
            <input type="text" id="input-name" dir="auto" data-i18n-placeholder="field.namePlaceholder" />
          </div>

          <!-- DEADLINE: DD/MM/YYYY date with calendar, 12-hour time with AM/PM, quick picks -->
          <fieldset class="form-group deadline">
            <legend data-i18n="field.deadline"></legend>

            <div class="deadline-fields">
              <div class="deadline-field">
                <label for="input-date" data-i18n="field.date"></label>
                <div class="input-row" id="date-wrap">
                  <input type="text" class="ltr-input" id="input-date" dir="ltr" inputmode="numeric" autocomplete="off"
                    maxlength="10"
                    aria-describedby="deadline-summary deadline-warning deadline-error" />
                  <button type="button" class="input-side-btn" id="btn-calendar"
                    data-i18n-aria-label="field.calendar" aria-haspopup="dialog"
                    aria-expanded="false" aria-controls="calendar">
                    <i data-lucide="calendar"></i>
                  </button>

                  <div class="calendar" id="calendar" role="dialog" data-i18n-aria-label="calendar.label" hidden>
                    <div class="calendar-header">
                      <button type="button" class="calendar-nav" id="cal-prev" data-i18n-aria-label="calendar.prev">
                        <i data-lucide="chevron-left"></i>
                      </button>
                      <span class="calendar-title" id="cal-title" aria-live="polite"></span>
                      <button type="button" class="calendar-nav" id="cal-next" data-i18n-aria-label="calendar.next">
                        <i data-lucide="chevron-right"></i>
                      </button>
                    </div>
                    <table class="calendar-grid" role="grid" aria-labelledby="cal-title">
                      <thead>
                        <tr id="cal-head"></tr>
                      </thead>
                      <tbody id="cal-body"></tbody>
                    </table>
                  </div>
                </div>
                <div class="quick-picks" role="group" data-i18n-aria-label="quick.dates">
                  <button type="button" class="chip" data-quick-date="today" data-i18n="quick.today"></button>
                  <button type="button" class="chip" data-quick-date="tomorrow" data-i18n="quick.tomorrow"></button>
                  <button type="button" class="chip" data-quick-date="next-week" data-i18n="quick.nextWeek"></button>
                </div>
              </div>

              <div class="deadline-field">
                <label for="input-time" data-i18n="field.time"></label>
                <div class="input-row">
                  <input type="text" class="ltr-input" id="input-time" dir="ltr" inputmode="decimal" autocomplete="off"
                    maxlength="12" data-i18n-placeholder="field.timePlaceholder"
                    aria-describedby="deadline-summary deadline-warning deadline-error" />
                  <div class="segmented ampm" role="group" data-i18n-aria-label="field.ampm">
                    <button type="button" class="seg-btn ampm-btn" data-period="AM" aria-pressed="true" data-i18n="time.am"></button>
                    <button type="button" class="seg-btn ampm-btn" data-period="PM" aria-pressed="false" data-i18n="time.pm"></button>
                  </div>
                </div>
                <div class="quick-picks quick-times" role="group" data-i18n-aria-label="quick.times">
                  <button type="button" class="chip" data-quick-time="09:00"></button>
                  <button type="button" class="chip" data-quick-time="12:00"></button>
                  <button type="button" class="chip" data-quick-time="17:00"></button>
                  <button type="button" class="chip" data-quick-time="23:59"></button>
                </div>
              </div>
            </div>

            <p class="deadline-summary" id="deadline-summary" aria-live="polite"></p>
            <p class="deadline-note deadline-warning" id="deadline-warning" data-i18n="deadline.past" hidden></p>
            <p class="deadline-note deadline-error" id="deadline-error" role="alert" hidden></p>
          </fieldset>

          <!-- REMINDER: how long before the deadline to notify, or a custom time -->
          <div class="form-group reminder-group" id="reminder-group">
            <label for="input-reminder" data-i18n="field.reminder"></label>
            <select id="input-reminder" aria-describedby="reminder-passed reminder-off reminder-error"></select>
            <div class="reminder-custom" id="reminder-custom" hidden>
              <span class="reminder-before" data-i18n="reminder.beforeWord"></span>
              <input type="text" class="ltr-input" id="input-reminder-amount" dir="ltr" inputmode="numeric" maxlength="4" autocomplete="off"
                data-i18n-aria-label="field.reminderAmount" aria-describedby="reminder-error" />
              <select id="input-reminder-unit" data-i18n-aria-label="field.reminderUnit">
                <option value="1"></option>
                <option value="60"></option>
                <option value="1440"></option>
              </select>
            </div>
            <p class="deadline-note" id="reminder-passed" data-i18n="reminder.passed" hidden></p>
            <div class="deadline-note reminder-off" id="reminder-off" hidden>
              <span id="reminder-off-text"></span>
              <button type="button" class="btn-secondary reminder-off-btn" id="btn-reminder-on"></button>
            </div>
            <p class="deadline-note deadline-error" id="reminder-error" role="alert" data-i18n="reminder.invalid" hidden></p>
          </div>

          <div class="form-group">
            <label for="input-label" data-i18n="field.label"></label>
            <select id="input-label">
              <option value="university" data-i18n="label.university"></option>
              <option value="work" data-i18n="label.work"></option>
              <option value="personal" data-i18n="label.personal"></option>
              <option value="health" data-i18n="label.health"></option>
              <option value="other" data-i18n="label.otherOption"></option>
            </select>
          </div>

          <div class="form-group" id="custom-label-group">
            <label for="input-custom-label" data-i18n="field.customLabel"></label>
            <input type="text" id="input-custom-label" dir="auto" data-i18n-placeholder="field.customLabelPlaceholder" />
          </div>

          <div class="form-group">
            <label for="input-priority" data-i18n="field.priority"></label>
            <select id="input-priority">
              <option value="low" data-i18n="priority.low"></option>
              <option value="medium" data-i18n="priority.medium"></option>
              <option value="high" data-i18n="priority.high"></option>
            </select>
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="btn-cancel" data-i18n="modal.cancel"></button>
          <button class="btn-primary shine" id="btn-save" data-i18n="modal.save"></button>
        </div>

      </div>
    </div>

    <!-- SMART SEARCH PROMPT: asks before the one-time download -->
    <div class="modal-overlay smart-overlay" id="smart-overlay">
      <div class="modal smart-dialog" role="dialog" aria-modal="true" aria-labelledby="smart-title" aria-describedby="smart-intro">

        <div class="modal-header">
          <h2 class="modal-title" id="smart-title" data-i18n="smart.title"></h2>
          <button class="icon-btn" id="btn-close-smart" data-i18n-title="modal.close" data-i18n-aria-label="modal.close">
            <i data-lucide="x"></i>
          </button>
        </div>

        <div class="smart-body">
          <span class="smart-badge" aria-hidden="true"><i data-lucide="sparkles"></i></span>
          <p class="smart-intro" id="smart-intro" data-i18n="smart.intro"></p>
        </div>

        <ul class="smart-facts">
          <li><i data-lucide="download" aria-hidden="true"></i><span id="smart-size"></span></li>
          <li><i data-lucide="wifi-off" aria-hidden="true"></i><span data-i18n="smart.offlineAfter"></span></li>
          <li><i data-lucide="shield-check" aria-hidden="true"></i><span data-i18n="smart.private"></span></li>
        </ul>

        <div class="modal-footer">
          <button class="btn-secondary" id="btn-smart-no" data-i18n="smart.notNow"></button>
          <button class="btn-main" id="btn-smart-yes"></button>
        </div>

      </div>
    </div>

    <!-- ASIDE PANEL -->
    <div class="aside-overlay" id="aside-overlay">
      <div class="aside" id="aside-panel">

        <div class="aside-header">
          <h2 class="aside-title" data-i18n="menu.title"></h2>
          <button class="icon-btn" id="btn-close-aside" data-i18n-title="menu.close" data-i18n-aria-label="menu.close">
            <i data-lucide="x"></i>
          </button>
        </div>

        <!-- PREFERENCES -->
        <section class="aside-section">
          <h3 class="aside-section-title" data-i18n="menu.preferences"></h3>

          <div class="pref-row">
            <label class="pref-label" for="pref-lang" data-i18n="menu.language"></label>
            <select id="pref-lang">
              <option value="en" lang="en"></option>
              <option value="ar" lang="ar"></option>
            </select>
          </div>

          <div class="pref-row">
            <label class="pref-label" for="pref-theme" data-i18n="menu.theme"></label>
            <select id="pref-theme">
              <option value="system" data-i18n="theme.system"></option>
              <option value="dark" data-i18n="theme.dark"></option>
              <option value="light" data-i18n="theme.light"></option>
            </select>
          </div>

          <div class="pref-row">
            <div class="pref-text">
              <label class="pref-label" for="pref-smart" data-i18n="menu.smartSearch"></label>
              <span class="pref-hint" id="smart-hint"></span>
            </div>
            <label class="toggle">
              <input type="checkbox" id="pref-smart" aria-describedby="smart-hint" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <!-- AI features: off until turned on, since they send text to Claude -->
          <div class="pref-row">
            <div class="pref-text">
              <label class="pref-label" for="pref-ai" data-i18n="menu.ai"></label>
              <span class="pref-hint" id="ai-hint" data-i18n="menu.aiHint"></span>
            </div>
            <label class="toggle">
              <input type="checkbox" id="pref-ai" aria-describedby="ai-hint" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="pref-row">
            <div class="pref-text">
              <label class="pref-label" for="pref-notifications" data-i18n="menu.notifications"></label>
              <span class="pref-hint" id="notif-hint" data-i18n="menu.notificationsHint"></span>
            </div>
            <label class="toggle">
              <input type="checkbox" id="pref-notifications" aria-describedby="notif-hint" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <div class="pref-row">
            <label class="pref-label" for="pref-reminder" data-i18n="menu.defaultReminder"></label>
            <select id="pref-reminder"></select>
          </div>

          <button class="btn-secondary full-width" id="btn-notif-settings" data-i18n="menu.notificationSettings"></button>
        </section>

        <!-- EXPORT -->
        <section class="aside-section">
          <h3 class="aside-section-title" data-i18n="menu.exportBackup"></h3>
          <button class="btn-secondary full-width" id="btn-export" data-i18n="menu.exportReport"></button>
          <button class="btn-secondary full-width" id="btn-backup" data-i18n="menu.backup"></button>
          <button class="btn-main full-width" id="btn-restore" data-i18n="menu.restore"></button>
          <input type="file" id="restore-file-input" accept=".json" style="display:none" />
        </section>

        <!-- SHORTCUTS -->
        <section class="aside-section">
          <h3 class="aside-section-title" data-i18n="menu.shortcuts"></h3>
          <dl class="shortcuts">
            <div class="shortcut-row">
              <dt><kbd>N</kbd></dt>
              <dd data-i18n="shortcut.new"></dd>
            </div>
            <div class="shortcut-row">
              <dt><kbd>Enter</kbd></dt>
              <dd data-i18n="shortcut.save"></dd>
            </div>
            <div class="shortcut-row">
              <dt><kbd>Esc</kbd></dt>
              <dd data-i18n="shortcut.close"></dd>
            </div>
          </dl>
        </section>

        <!-- HELP: the tour and the Help panel (tour.js) -->
        <section class="aside-section">
          <h3 class="aside-section-title" data-i18n="menu.help"></h3>
          <button type="button" class="menu-row" id="btn-tour">
            <span class="menu-row-icon" aria-hidden="true"><i data-lucide="route"></i></span>
            <span class="pref-text">
              <span class="pref-label" data-i18n="menu.tour"></span>
              <span class="pref-hint" data-i18n="menu.tourHint"></span>
            </span>
            <i class="menu-row-arrow" data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" class="menu-row" id="btn-help">
            <span class="menu-row-icon" aria-hidden="true"><i data-lucide="circle-help"></i></span>
            <span class="pref-text">
              <span class="pref-label" data-i18n="menu.helpPanel"></span>
              <span class="pref-hint" data-i18n="menu.helpPanelHint"></span>
            </span>
            <i class="menu-row-arrow" data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
          <button type="button" class="menu-row" id="btn-install-help">
            <span class="menu-row-icon" aria-hidden="true"><i data-lucide="smartphone"></i></span>
            <span class="pref-text">
              <span class="pref-label" data-i18n="guide.install.title"></span>
              <span class="pref-hint" data-i18n="menu.installHint"></span>
            </span>
            <i class="menu-row-arrow" data-lucide="chevron-right" aria-hidden="true"></i>
          </button>
        </section>

      </div>
    </div>

    <!-- WELCOME: offers the tour on a first visit, or before a tour with no tasks -->
    <div class="modal-overlay welcome-overlay" id="welcome-overlay">
      <div class="modal welcome-dialog" role="dialog" aria-modal="true" aria-labelledby="welcome-title" aria-describedby="welcome-text">
        <!-- A route to a flag -->
        <svg class="welcome-art" viewBox="0 0 120 120" aria-hidden="true">
          <rect class="art-board" x="12" y="24" width="88" height="80" rx="16" />
          <path class="art-route" d="M30 86c16 0 10-24 28-24s14-22 30-22" />
          <circle class="art-stop" cx="30" cy="86" r="6" />
          <circle class="art-stop" cx="58" cy="62" r="5" />
          <path class="art-pole" d="M88 46V14" />
          <path class="art-flag" d="M88 14h22l-6 8 6 8H88z" />
        </svg>
        <h2 class="modal-title welcome-title" id="welcome-title" data-i18n="welcome.title"></h2>
        <p class="welcome-text" id="welcome-text" data-i18n="welcome.text"></p>

        <div class="pref-row welcome-samples">
          <div class="pref-text">
            <label class="pref-label" for="welcome-samples" data-i18n="welcome.samples"></label>
            <span class="pref-hint" id="welcome-samples-hint" data-i18n="welcome.samplesHint"></span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="welcome-samples" checked aria-describedby="welcome-samples-hint" />
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="btn-welcome-skip" data-i18n="welcome.skip"></button>
          <button class="btn-main" id="btn-welcome-start" data-i18n="welcome.start"></button>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast" role="status" aria-live="polite">
      <span id="toast-message"></span>
      <button class="toast-action" id="toast-action" hidden></button>
    </div>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
