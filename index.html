<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A task manager with labels, priorities, deadlines and reminders." />
    <meta name="theme-color" content="#0a7285" />
    <title>Task Manager</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <!-- Fonts are local (fonts/) so both languages work offline -->
    <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Pinned local copy of Lucide so icons work offline -->
    <script src="lib/lucide-1.51.0.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="btn-add" data-i18n-title="header.add" data-i18n-aria-label="header.add">
          <i data-lucide="plus"></i>
        </button>
        <button class="icon-btn" id="btn-delete" disabled>
          <i data-lucide="trash-2"></i>
        </button>
        <button class="icon-btn" id="btn-edit" disabled>
          <i data-lucide="pencil"></i>
        </button>
        <button class="icon-btn" id="btn-reload" data-i18n-title="header.reload" data-i18n-aria-label="header.reload">
          <i data-lucide="rotate-cw"></i>
        </button>
      </div>

      <div class="header-center">
        <h1 class="app-title" data-i18n="app.title"></h1>
      </div>

      <div class="header-right">
        <button class="lang-btn" id="btn-lang" type="button" data-i18n-title="lang.switch" data-i18n-aria-label="lang.switch"></button>
        <button class="icon-btn" id="btn-filter" data-i18n-title="header.filter" data-i18n-aria-label="header.filter">
          <i data-lucide="filter"></i>
        </button>
        <button class="icon-btn" id="btn-search" data-i18n-title="header.search" data-i18n-aria-label="header.search">
          <i data-lucide="search"></i>
        </button>
        <button class="icon-btn" id="btn-menu" data-i18n-title="header.menu" data-i18n-aria-label="header.menu">
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main">

      <!-- SEARCH BAR -->
      <div class="search-bar" id="search-bar">
        <i data-lucide="search"></i>
        <input type="text" id="search-input" dir="auto" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="header.search" />
        <button class="icon-btn" id="btn-close-search" data-i18n-title="search.close" data-i18n-aria-label="search.close">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="all" data-i18n="filter.all"></button>
        <button class="filter-btn" data-filter="active" data-i18n="filter.active"></button>
        <button class="filter-btn" data-filter="overdue" data-i18n="filter.overdue"></button>
        <button class="filter-btn" data-filter="completed" data-i18n="filter.completed"></button>
        <select class="toolbar-select" id="filter-label" data-i18n-aria-label="filter.byLabel">
          <option value="all" data-i18n="filter.allLabels"></option>
        </select>
        <select class="toolbar-select" id="filter-priority" data-i18n-aria-label="filter.byPriority">
          <option value="all" data-i18n="filter.allPriorities"></option>
          <option value="high" data-i18n="priority.high"></option>
          <option value="medium" data-i18n="priority.medium"></option>
          <option value="low" data-i18n="priority.low"></option>
        </select>
      </div>

      <!-- LIST TOOLBAR -->
      <div class="list-toolbar">
        <div class="stats">
          <span class="stats-text" id="stats-text"></span>
          <div class="progress" id="progress" role="progressbar" data-i18n-aria-label="stats.label" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>
        <label class="sort-control">
          <span data-i18n="sort.by"></span>
          <select class="toolbar-select" id="sort-select">
            <option value="deadline" data-i18n="sort.deadline"></option>
            <option value="priority" data-i18n="sort.priority"></option>
          </select>
        </label>
      </div>

      <!-- TASK LIST -->
      <section class="task-list" id="task-list"></section>

      <!-- EMPTY STATE -->
      <div class="empty-state" id="empty-state">
        <p></p>
      </div>

    </main>

    <!-- ADD/EDIT MODAL -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">

        <div class="modal-header">
          <h2 class="modal-title" id="modal-title"></h2>
          <button class="icon-btn" id="btn-close-modal" data-i18n-title="modal.close" data-i18n-aria-label="modal.close">
            <i data-lucide="x"></i>
          </button>
        </div>

        <div class="modal-body">

          <div class="form-group">
            <label for="input-name" data-i18n="field.name"></label>
            <input type="text" id="input-name" dir="auto" data-i18n-placeholder="field.namePlaceholder" />
          </div>

          <!-- DEADLINE: DD/MM/YYYY date with calendar, 12-hour time with AM/PM, quick picks -->
          <fieldset class="form-group deadline">
            <legend data-i18n="field.deadline"></legend>

            <div class="deadline-fields">
              <div class="deadline-field">
                <label for="input-date" data-i18n="field.date"></label>
                <div class="input-row" id="date-wrap">
                  <input type="text" class="ltr-input" id="input-date" dir="ltr" inputmode="numeric" autocomplete="off"
                    maxlength="10"
                    aria-describedby="deadline-summary deadline-warning deadline-error" />
                  <button type="button" class="input-side-btn" id="btn-calendar"
                    data-i18n-aria-label="field.calendar" aria-haspopup="dialog"
                    aria-expanded="false" aria-controls="calendar">
                    <i data-lucide="calendar"></i>
                  </button>

                  <div class="calendar" id="calendar" role="dialog" data-i18n-aria-label="calendar.label" hidden>
                    <div class="calendar-header">
                      <button type="button" class="calendar-nav" id="cal-prev" data-i18n-aria-label="calendar.prev">
                        <i data-lucide="chevron-left"></i>
                      </button>
                      <span class="calendar-title" id="cal-title" aria-live="polite"></span>
                      <button type="button" class="calendar-nav" id="cal-next" data-i18n-aria-label="calendar.next">
                        <i data-lucide="chevron-right"></i>
                      </button>
                    </div>
                    <table class="calendar-grid" role="grid" aria-labelledby="cal-title">
                      <thead>
                        <tr id="cal-head"></tr>
                      </thead>
                      <tbody id="cal-body"></tbody>
                    </table>
                  </div>
                </div>
                <div class="quick-picks" role="group" data-i18n-aria-label="quick.dates">
                  <button type="button" class="chip" data-quick-date="today" data-i18n="quick.today"></button>
                  <button type="button" class="chip" data-quick-date="tomorrow" data-i18n="quick.tomorrow"></button>
                  <button type="button" class="chip" data-quick-date="next-week" data-i18n="quick.nextWeek"></button>
                </div>
              </div>

              <div class="deadline-field">
                <label for="input-time" data-i18n="field.time"></label>
                <div class="input-row">
                  <input type="text" class="ltr-input" id="input-time" dir="ltr" inputmode="decimal" autocomplete="off"
                    maxlength="12" data-i18n-placeholder="field.timePlaceholder"
                    aria-describedby="deadline-summary deadline-warning deadline-error" />
                  <div class="ampm" role="group" data-i18n-aria-label="field.ampm">
                    <button type="button" class="ampm-btn" data-period="AM" aria-pressed="true" data-i18n="time.am"></button>
                    <button type="button" class="ampm-btn" data-period="PM" aria-pressed="false" data-i18n="time.pm"></button>
                  </div>
                </div>
                <div class="quick-picks quick-times" role="group" data-i18n-aria-label="quick.times">
                  <button type="button" class="chip" data-quick-time="09:00"></button>
                  <button type="button" class="chip" data-quick-time="12:00"></button>
                  <button type="button" class="chip" data-quick-time="17:00"></button>
                  <button type="button" class="chip" data-quick-time="23:59"></button>
                </div>
              </div>
            </div>

            <p class="deadline-summary" id="deadline-summary" aria-live="polite"></p>
            <p class="deadline-note deadline-warning" id="deadline-warning" data-i18n="deadline.past" hidden></p>
            <p class="deadline-note deadline-error" id="deadline-error" role="alert" hidden></p>
          </fieldset>

          <div class="form-group">
            <label for="input-label" data-i18n="field.label"></label>
            <select id="input-label">
              <option value="university" data-i18n="label.university"></option>
              <option value="work" data-i18n="label.work"></option>
              <option value="personal" data-i18n="label.personal"></option>
              <option value="health" data-i18n="label.health"></option>
              <option value="other" data-i18n="label.otherOption"></option>
            </select>
          </div>

          <div class="form-group" id="custom-label-group">
            <label for="input-custom-label" data-i18n="field.customLabel"></label>
            <input type="text" id="input-custom-label" dir="auto" data-i18n-placeholder="field.customLabelPlaceholder" />
          </div>

          <div class="form-group">
            <label for="input-priority" data-i18n="field.priority"></label>
            <select id="input-priority">
              <option value="low" data-i18n="priority.low"></option>
              <option value="medium" data-i18n="priority.medium"></option>
              <option value="high" data-i18n="priority.high"></option>
            </select>
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="btn-cancel" data-i18n="modal.cancel"></button>
          <button class="btn-primary" id="btn-save" data-i18n="modal.save"></button>
        </div>

      </div>
    </div>

    <!-- ASIDE PANEL -->
    <div class="aside-overlay" id="aside-overlay">
      <div class="aside" id="aside-panel">

        <div class="aside-header">
          <h2 class="aside-title" data-i18n="menu.title"></h2>
          <button class="icon-btn" id="btn-close-aside" data-i18n-title="menu.close" data-i18n-aria-label="menu.close">
            <i data-lucide="x"></i>
          </button>
        </div>

        <!-- PREFERENCES -->
        <section class="aside-section">
          <h3 class="aside-section-title" data-i18n="menu.preferences"></h3>

          <div class="pref-row">
            <label class="pref-label" for="pref-lang" data-i18n="menu.language"></label>
            <select id="pref-lang">
              <option value="en" lang="en"></option>
              <option value="ar" lang="ar"></option>
            </select>
          </div>

          <div class="pref-row">
            <label class="pref-label" for="pref-theme" data-i18n="menu.theme"></label>
            <select id="pref-theme">
              <option value="system" data-i18n="theme.system"></option>
              <option value="dark" data-i18n="theme.dark"></option>
              <option value="light" data-i18n="theme.light"></option>
            </select>
          </div>

          <div class="pref-row">
            <label class="pref-label" for="pref-notifications" data-i18n="menu.notifications"></label>
            <label class="toggle">
              <input type="checkbox" id="pref-notifications" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <button class="btn-secondary full-width" id="btn-notif-settings" data-i18n="menu.notificationSettings"></button>
        </section>

        <!-- EXPORT -->
        <section class="aside-section">
          <h3 class="aside-section-title" data-i18n="menu.exportBackup"></h3>
          <button class="btn-secondary full-width" id="btn-export" data-i18n="menu.exportReport"></button>
          <button class="btn-secondary full-width" id="btn-backup" data-i18n="menu.backup"></button>
          <button class="btn-primary full-width" id="btn-restore" data-i18n="menu.restore"></button>
          <input type="file" id="restore-file-input" accept=".json" style="display:none" />
        </section>

        <!-- SHORTCUTS -->
        <section class="aside-section">
          <h3 class="aside-section-title" data-i18n="menu.shortcuts"></h3>
          <dl class="shortcuts">
            <div class="shortcut-row">
              <dt><kbd>N</kbd></dt>
              <dd data-i18n="shortcut.new"></dd>
            </div>
            <div class="shortcut-row">
              <dt><kbd>Enter</kbd></dt>
              <dd data-i18n="shortcut.save"></dd>
            </div>
            <div class="shortcut-row">
              <dt><kbd>Esc</kbd></dt>
              <dd data-i18n="shortcut.close"></dd>
            </div>
          </dl>
        </section>

      </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast" role="status" aria-live="polite">
      <span id="toast-message"></span>
      <button class="toast-action" id="toast-action"></button>
    </div>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
