<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A task manager with labels, priorities, deadlines and reminders." />
    <meta name="theme-color" content="#0c8599" />
    <title>Task Manager</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <!-- Pinned local copy of Lucide so icons work offline -->
    <script src="lib/lucide-1.51.0.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="btn-add" title="Add task (N)">
          <i data-lucide="plus"></i>
        </button>
        <button class="icon-btn" id="btn-delete" title="Select tasks to delete" disabled>
          <i data-lucide="trash-2"></i>
        </button>
        <button class="icon-btn" id="btn-edit" title="Select one task to edit" disabled>
          <i data-lucide="pencil"></i>
        </button>
        <button class="icon-btn" id="btn-reload" title="Reload tasks">
          <i data-lucide="rotate-cw"></i>
        </button>
      </div>

      <div class="header-center">
        <h1 class="app-title">Task Manager</h1>
      </div>

      <div class="header-right">
        <button class="icon-btn" id="btn-filter" title="Filter tasks">
          <i data-lucide="filter"></i>
        </button>
        <button class="icon-btn" id="btn-search" title="Search tasks">
          <i data-lucide="search"></i>
        </button>
        <button class="icon-btn" id="btn-menu" title="Menu">
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main">

      <!-- SEARCH BAR -->
      <div class="search-bar" id="search-bar">
        <i data-lucide="search"></i>
        <input type="text" id="search-input" placeholder="Search tasks..." />
        <button class="icon-btn" id="btn-close-search">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="overdue">Overdue</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <select class="toolbar-select" id="filter-label" aria-label="Filter by label">
          <option value="all">All labels</option>
        </select>
        <select class="toolbar-select" id="filter-priority" aria-label="Filter by priority">
          <option value="all">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
      </div>

      <!-- LIST TOOLBAR -->
      <div class="list-toolbar">
        <div class="stats">
          <span class="stats-text" id="stats-text"></span>
          <div class="progress" id="progress" role="progressbar" aria-label="Done today" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>
        <label class="sort-control">
          Sort by
          <select class="toolbar-select" id="sort-select">
            <option value="deadline">Deadline</option>
            <option value="priority">Priority</option>
          </select>
        </label>
      </div>

      <!-- TASK LIST -->
      <section class="task-list" id="task-list"></section>

      <!-- EMPTY STATE -->
      <div class="empty-state" id="empty-state">
        <p>No tasks yet, click on the + to add one</p>
      </div>

    </main>

    <!-- ADD/EDIT MODAL -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">

        <div class="modal-header">
          <h2 class="modal-title" id="modal-title">Add Task</h2>
          <button class="icon-btn" id="btn-close-modal">
            <i data-lucide="x"></i>
          </button>
        </div>

        <div class="modal-body">

          <div class="form-group">
            <label for="input-name">Task name</label>
            <input type="text" id="input-name" placeholder="e.g. Finish assignment" />
          </div>

          <div class="form-group">
            <label for="input-datetime">Date & time</label>
            <input type="datetime-local" id="input-datetime" />
          </div>

          <div class="form-group">
            <label for="input-label">Label</label>
            <select id="input-label">
              <option value="university">University</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="health">Health</option>
              <option value="other">Other (type your own)</option>
            </select>
          </div>

          <div class="form-group" id="custom-label-group">
            <label for="input-custom-label">Custom label</label>
            <input type="text" id="input-custom-label" placeholder="Type your label" />
          </div>

          <div class="form-group">
            <label for="input-priority">Priority</label>
            <select id="input-priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="btn-cancel">Cancel</button>
          <button class="btn-primary" id="btn-save">Save task</button>
        </div>

      </div>
    </div>

    <!-- ASIDE PANEL -->
    <div class="aside-overlay" id="aside-overlay">
      <div class="aside" id="aside-panel">

        <div class="aside-header">
          <h2 class="aside-title">Menu</h2>
          <button class="icon-btn" id="btn-close-aside">
            <i data-lucide="x"></i>
          </button>
        </div>

        <!-- PREFERENCES -->
        <section class="aside-section">
          <h3 class="aside-section-title">Preferences</h3>

          <div class="pref-row">
            <label class="pref-label">Theme</label>
            <select id="pref-theme">
              <option value="system">System default</option>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>

          <div class="pref-row">
            <label class="pref-label">Notifications</label>
            <label class="toggle">
              <input type="checkbox" id="pref-notifications" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <button class="btn-secondary full-width" id="btn-notif-settings">
            Notification settings
          </button>
        </section>

        <!-- EXPORT -->
        <section class="aside-section">
          <h3 class="aside-section-title">Export & Backup</h3>
          <button class="btn-secondary full-width" id="btn-export">
            Export report (.txt)
          </button>
          <button class="btn-secondary full-width" id="btn-backup">
            Backup tasks (.json)
          </button>
          <button class="btn-primary full-width" id="btn-restore">
            Restore from backup
          </button>
          <input type="file" id="restore-file-input" accept=".json" style="display:none" />
        </section>

        <!-- SHORTCUTS -->
        <section class="aside-section">
          <h3 class="aside-section-title">Shortcuts</h3>
          <dl class="shortcuts">
            <div class="shortcut-row">
              <dt><kbd>N</kbd></dt>
              <dd>New task</dd>
            </div>
            <div class="shortcut-row">
              <dt><kbd>Enter</kbd></dt>
              <dd>Save task</dd>
            </div>
            <div class="shortcut-row">
              <dt><kbd>Esc</kbd></dt>
              <dd>Close window, menu or search</dd>
            </div>
          </dl>
        </section>

      </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast" role="status" aria-live="polite">
      <span id="toast-message"></span>
      <button class="toast-action" id="toast-action"></button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
