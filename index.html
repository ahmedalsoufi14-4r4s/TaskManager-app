<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="btn-add" title="Add task">
          <i data-lucide="plus"></i>
        </button>
        <button class="icon-btn" id="btn-delete" title="Delete task">
          <i data-lucide="trash-2"></i>
        </button>
        <button class="icon-btn" id="btn-edit" title="Edit task">
          <i data-lucide="pencil"></i>
        </button>
        <button class="icon-btn" id="btn-reload" title="Reload tasks">
          <i data-lucide="rotate-cw"></i>
        </button>
      </div>

      <div class="header-center">
        <h1 class="app-title">Task Manager</h1>
      </div>

      <div class="header-right">
        <button class="icon-btn" id="btn-filter" title="Filter tasks">
          <i data-lucide="filter"></i>
        </button>
        <button class="icon-btn" id="btn-search" title="Search tasks">
          <i data-lucide="search"></i>
        </button>
        <button class="icon-btn" id="btn-menu" title="Menu">
          <i data-lucide="menu"></i>
        </button>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main">

      <!-- SEARCH BAR -->
      <div class="search-bar" id="search-bar">
        <i data-lucide="search"></i>
        <input type="text" id="search-input" placeholder="Search tasks..." />
        <button class="icon-btn" id="btn-close-search">
          <i data-lucide="x"></i>
        </button>
      </div>

      <!-- FILTER BAR -->
      <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <!-- TASK LIST -->
      <section class="task-list" id="task-list"></section>

      <!-- EMPTY STATE -->
      <div class="empty-state" id="empty-state">
        <p>No tasks yet, click on the + to add one</p>
      </div>

    </main>

    <!-- ADD/EDIT MODAL -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">

        <div class="modal-header">
          <h2 class="modal-title" id="modal-title">Add Task</h2>
          <button class="icon-btn" id="btn-close-modal">
            <i data-lucide="x"></i>
          </button>
        </div>

        <div class="modal-body">

          <div class="form-group">
            <label for="input-name">Task name</label>
            <input type="text" id="input-name" placeholder="e.g. Finish assignment" />
          </div>

          <div class="form-group">
            <label for="input-datetime">Date & time</label>
            <input type="datetime-local" id="input-datetime" />
          </div>

          <div class="form-group">
            <label for="input-label">Label</label>
            <select id="input-label">
              <option value="university">University</option>
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="health">Health</option>
              <option value="other">Other (type your own)</option>
            </select>
          </div>

          <div class="form-group" id="custom-label-group">
            <label for="input-custom-label">Custom label</label>
            <input type="text" id="input-custom-label" placeholder="Type your label" />
          </div>

          <div class="form-group">
            <label for="input-priority">Priority</label>
            <select id="input-priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn-secondary" id="btn-cancel">Cancel</button>
          <button class="btn-primary" id="btn-save">Save task</button>
        </div>

      </div>
    </div>

    <!-- ASIDE PANEL -->
    <div class="aside-overlay" id="aside-overlay">
      <div class="aside" id="aside-panel">

        <div class="aside-header">
          <h2 class="aside-title">Menu</h2>
          <button class="icon-btn" id="btn-close-aside">
            <i data-lucide="x"></i>
          </button>
        </div>

        <!-- PREFERENCES -->
        <section class="aside-section">
          <h3 class="aside-section-title">Preferences</h3>

          <div class="pref-row">
            <label class="pref-label">Theme</label>
            <select id="pref-theme">
              <option value="system">System default</option>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>

          <div class="pref-row">
            <label class="pref-label">Notifications</label>
            <label class="toggle">
              <input type="checkbox" id="pref-notifications" />
              <span class="toggle-slider"></span>
            </label>
          </div>

          <button class="btn-secondary full-width" id="btn-notif-settings">
            Notification settings
          </button>
        </section>

        <!-- EXPORT -->
        <section class="aside-section">
          <h3 class="aside-section-title">Export & Backup</h3>
          <button class="btn-secondary full-width" id="btn-export">
            Export report (.txt)
          </button>
          <button class="btn-secondary full-width" id="btn-backup">
            Backup tasks (.json)
          </button>
          <button class="btn-primary full-width" id="btn-restore">
            Restore from backup
          </button>
          <input type="file" id="restore-file-input" accept=".json" style="display:none" />
        </section>

      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
